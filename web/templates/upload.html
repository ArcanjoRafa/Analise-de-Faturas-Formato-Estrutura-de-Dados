<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload de Faturas</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/upload.css') }}">
    <script src="{{ url_for('static', filename='js/tema.js') }}"></script>
</head>
<body>
    <aside class="sidebar" id="sidebar">
        <button type="button" class="hamburger" id="botao-menu"
                aria-label="Expandir ou recolher o menu">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor"
                 stroke-width="2" stroke-linecap="round" aria-hidden="true">
                <path d="M4 6h16"/><path d="M4 12h16"/><path d="M4 18h16"/>
            </svg>
        </button>
        <nav class="sidebar-nav">
            <a href="/" class="ativa"><span class="icone" aria-hidden="true"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V3"/><path d="M7 8l5-5 5 5"/><path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg></span><span class="rotulo">Upload</span></a>
            <a href="/configuracoes"><span class="icone" aria-hidden="true"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg></span><span class="rotulo">Configurações</span></a>
            <a href="/clientes"><span class="icone" aria-hidden="true"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg></span><span class="rotulo">Clientes</span></a>
            <a href="/auditoria"><span class="icone" aria-hidden="true"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 4 8 8 8 8z"/></svg></span><span class="rotulo">Auditoria</span></a>
        </nav>
    </aside>

    <main class="container">
        <h1><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 15V3"/><path d="M7 8l5-5 5 5"/><path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg> Upload de Faturas</h1>

        <!-- Campo de upload: clique ou arrastar; aceita um PDF por vez -->
        <section class="area-upload" id="area-upload" role="button" tabindex="0"
                 aria-label="Selecionar PDF de fatura">
            <input type="file" id="campo-arquivo" accept=".pdf,application/pdf" hidden>
            <svg viewBox="0 0 24 24" width="42" height="42" fill="none" stroke="currentColor"
                 stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M12 16V4"/><path d="M7 9l5-5 5 5"/><path d="M5 20h14"/>
            </svg>
            <p class="area-texto">Arraste o PDF aqui ou clique para procurar</p>
            <p class="area-dica">Um arquivo por vez — apenas .pdf</p>
        </section>

        <!-- Recusa inline (extensão que não é .pdf) -->
        <p id="aviso" class="aviso" hidden></p>

        <!-- Nome do arquivo + botões -->
        <div class="selecao">
            <p id="nome-arquivo" class="nome-arquivo"></p>
            <div class="botoes">
                <button type="button" id="botao-upload" class="botao primario" disabled>Realizar Upload</button>
                <button type="button" id="botao-cancelar" class="botao" disabled>Cancelar</button>
            </div>
        </div>

        <!-- Histórico de tentativas -->
        <section class="historico">
            <h2>Histórico de uploads</h2>
            <table id="tabela-historico">
                <thead>
                    <tr>
                        <th>Nome do PDF</th>
                        <th>Data do upload</th>
                        <th>Status</th>
                        <th>Erro</th>
                        <th>Ação</th>
                    </tr>
                </thead>
                <tbody id="corpo-historico"></tbody>
            </table>
        </section>
    </main>

    <!-- Resultado do último upload (badge/toast colorido) -->
    <div id="toast" class="toast" hidden></div>

    <script src="{{ url_for('static', filename='js/menu.js') }}"></script>
    <script src="{{ url_for('static', filename='js/upload.js') }}"></script>
</body>
</html>
