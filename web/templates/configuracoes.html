    <main class="container">

        <section class="card">
            <h2>Aparência</h2>
            <p class="config-dica">Escolha entre a tela clara e a escura. A escolha fica
               salva neste navegador e vale para as duas páginas.</p>
            <div class="alternador" role="group" aria-label="Tema da tela">
                <button type="button" class="alternador-item" data-tema-botao="claro">
                    <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor"
                         stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg> Claro
                </button>
                <button type="button" class="alternador-item" data-tema-botao="escuro">
                    <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor"
                         stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg> Escuro
                </button>
            </div>
        </section>
    </main>

    <script src="{{ url_for('static', filename='js/menu.js') }}"></script>
